[tool:pytest]
# Pytest configuration for ConvrseConnectBackend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add options
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=48
    --asyncio-mode=auto
    --disable-warnings
    -m "not integration and not security and not e2e"
    --ignore=test_scripts/
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::PydanticDeprecatedSince20
    ignore::RuntimeWarning

# Markers
markers =
    unit: Unit tests
    integration: Integration tests (require database)
    security: Security tests (require database)
    e2e: End-to-end tests
    auth: Authentication related tests
    api: API endpoint tests
    database: Database related tests
    slow: Slow running tests
    external: Tests that require external services
    smoke: Smoke tests
    regression: Regression tests
    validation: Input validation tests
    performance: Performance tests

# Test timeout (in seconds)
timeout = 300

# Asyncio configuration
asyncio_mode = auto

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Environment variables
env = 
    ENVIRONMENT = test
    DATABASE_URL = sqlite+aiosqlite:///./test.db
    JWT_SECRET_KEY = test-secret-key-for-testing-only-at-least-32-chars
    REDIS_URL = redis://localhost:6379/0
    KAFKA_BOOTSTRAP_SERVERS = localhost:9092
    AUTH_SERVICE_URL = http://localhost:8001
    AUTH_SERVICE_TOKEN = test-auth-service-token
    ACTIVE_EVENT_BUS = kafka
    DEBUG = true
    AUTH_CIRCUIT_BREAKER_FAILURE_THRESHOLD = 100
    AUTH_CIRCUIT_BREAKER_RECOVERY_TIMEOUT = 1 